# docker compose up --build   (needs DB_PASSWORD, see .env.example)
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: online_shopping_application
    ports:
      - "3307:3306"   # host 3307 -> matches the default DB_URL for running the app outside Docker
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/online_shopping_application
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
    ports:
      - "9977:9977"
    volumes:
      - uploads:/data/uploads

volumes:
  dbdata:
  uploads:
