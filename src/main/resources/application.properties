server.port=${PORT:9977}

# Load local secrets from .env (optional; env vars still override)
spring.config.import=optional:file:.env[.properties]

# --- Database (override with environment variables; no credentials in source) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/online_shopping_application?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JSP views ---
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- Admin account (if ADMIN_PASSWORD is empty a random one is generated and logged at startup) ---
app.admin.email=${ADMIN_EMAIL:admin@shop.local}
app.admin.password=${ADMIN_PASSWORD:}

# --- Where vendor-uploaded product images are stored (served at /Images/**) ---
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
